<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitForge Progress</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="Progress.css">
</head>

<body>

<header>
    <div class="navbar">

        <div class="logo">
            <i class="fa-solid fa-dumbbell"></i>
            FitForge
        </div>

        <nav>
            <a href="Home.html">Home</a>
            <a href="Dashboard.html">Dashboard</a>
            <a href="Workout.html">Workouts</a>
            <a href="Progress.html">Progress</a>
            
        </nav>

    </div>
</header>


<main>

    <section class="section">

        <h1>My Progress</h1>

        <div class="cards">

            <div class="card">
                <i class="fa-solid fa-dumbbell"></i>
                <h2>18</h2>
                <p>Workouts Completed</p>
            </div>

            <div class="card">
                <i class="fa-solid fa-clock"></i>
                <h2>420 min</h2>
                <p>Workout Time</p>
            </div>

            <div class="card">
                <i class="fa-solid fa-fire"></i>
                <h2>5,200</h2>
                <p>Calories Burned</p>
            </div>

        </div>

    </section>



    <section class="section">

        <h2>Weekly Progress</h2>

        <div class="weekly">

            <div>
                <span>Monday</span>
                <div class="bar"><div style="width:60%"></div></div>
                <small>60%</small>
            </div>

            <div>
                <span>Tuesday</span>
                <div class="bar"><div style="width:80%"></div></div>
                <small>80%</small>
            </div>

            <div>
                <span>Wednesday</span>
                <div class="bar"><div style="width:40%"></div></div>
                <small>40%</small>
            </div>

            <div>
                <span>Thursday</span>
                <div class="bar"><div style="width:70%"></div></div>
                <small>70%</small>
            </div>

            <div>
                <span>Friday</span>
                <div class="bar"><div style="width:90%"></div></div>
                <small>90%</small>
            </div>

            <div>
                <span>Saturday</span>
                <div class="bar"><div style="width:60%"></div></div>
                <small>60%</small>
            </div>

        </div>

    </section>


</body>
</html>
